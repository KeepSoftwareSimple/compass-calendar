<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compass is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f3eee2;
        color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #06090f;
          color: #f5f5f5;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 2rem;
        box-sizing: border-box;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        opacity: 0.85;
      }
      a {
        display: inline-block;
        padding: 0.5rem 1.25rem;
        border-radius: 0.5rem;
        background: #2563eb;
        color: #fff;
        text-decoration: none;
        font-weight: 500;
      }
      a:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>Compass could not reach the calendar. Check your connection and try again.</p>
      <a href="compass-offline://retry">Retry</a>
    </main>
  </body>
</html>
