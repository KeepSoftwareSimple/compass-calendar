<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Compass is offline</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          sans-serif;
        background: #f3eee2;
        color: #1a1a1a;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #06090f;
          color: #e8e8e8;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.25rem;
        line-height: 1.5;
        opacity: 0.85;
      }
      button {
        font: inherit;
        cursor: pointer;
        border: 1px solid rgba(127, 127, 127, 0.4);
        border-radius: 8px;
        padding: 0.5rem 1rem;
        background: rgba(127, 127, 127, 0.12);
      }
      button:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>
        Compass could not reach the calendar. Check your connection, then try
        again.
      </p>
      <button type="button" id="retry">Retry</button>
    </main>
    <script>
      document.getElementById("retry").addEventListener("click", function () {
        if (
          window.webkit &&
          window.webkit.messageHandlers &&
          window.webkit.messageHandlers.offlineRetry
        ) {
          window.webkit.messageHandlers.offlineRetry.postMessage("retry");
        }
      });
    </script>
  </body>
</html>
