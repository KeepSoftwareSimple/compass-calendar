# XcodeGen spec for Compass for macOS (docs/features/desktop-client.md).
# `xcodegen generate` writes Compass.xcodeproj, which is not checked in.
name: Compass
options:
  bundleIdPrefix: com.compasscalendar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    # Empty is stable. release-macos-dev.yml passes COMPASS_UPDATE_CHANNEL=dev.
    COMPASS_UPDATE_CHANNEL: ""
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_STRICT_CONCURRENCY: complete
    # Ad hoc signing so local and CI builds run. Developer ID signing is
    # release-only (release-macos.yml).
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
packages:
  CompassKit:
    path: CompassKit
  CompassData:
    path: CompassData
  CompassUI:
    path: CompassUI
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.4
targets:
  Compass:
    type: application
    platform: macOS
    sources:
      - Compass
    resources:
      - path: Resources/icon.icns
        optional: true
      - path: Resources/Fonts
        type: folder
    settings:
      base:
        PRODUCT_NAME: Compass
        PRODUCT_BUNDLE_IDENTIFIER: com.compasscalendar.desktop
        INFOPLIST_FILE: Resources/Info.plist
    dependencies:
      - package: CompassKit
      - package: CompassData
      - package: CompassUI
      - package: Sparkle
  CompassKitTests:
    type: bundle.unit-test
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    sources:
      - CompassKitTests
    resources:
      - path: CompassKitTests/Fixtures
        type: folder
    dependencies:
      - package: CompassKit
  CompassUITests:
    type: bundle.ui-testing
    platform: macOS
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
    sources:
      - CompassUITests
    dependencies:
      - target: Compass
schemes:
  Compass:
    build:
      targets:
        Compass: all
    test:
      targets:
        - CompassKitTests
        - CompassUITests
