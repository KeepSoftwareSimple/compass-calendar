name: Hidden events store stress

# Manual guard for HiddenEventsStoreTests ordering. Not a required PR check.
on:
  workflow_dispatch:
    inputs:
      iterations:
        description: Number of swift test repetitions
        type: number
        default: 50
      ref:
        description: Git ref to test
        type: string
        default: main

permissions:
  contents: read

jobs:
  stress:
    name: Stress HiddenEventsStore superseded test
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Run repeated swift test
        run: bash .github/scripts/test-hidden-events-store-stress.sh "${{ inputs.iterations }}"
