name: Desktop web parity screenshots

# Captures the same Compass surfaces on macOS (XCUITest) and web (Playwright),
# then composes side-by-side PNGs for parity review. Re-run after each desktop
# UI PR via workflow_dispatch.
#
# On pull requests it runs only when the PR carries the `parity-screenshots`
# label. It used to run on every PR touching apps/calendar-web, which started a
# macOS capture (the scarce runner) for web-only changes; that was about a third
# of all macOS minutes. Add the label to a desktop UI PR to get the comparison.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths:
      - "apps/calendar-macos/CompassUI/**"
      - "apps/calendar-macos/CompassUITests/**"
      - "apps/calendar-web/**"
      - "e2e/parity/**"
      - ".github/workflows/desktop-web-parity-screenshots.yml"
      - ".github/scripts/record-macos-parity-captures.sh"
      - ".github/scripts/compose-desktop-parity-shots.py"

permissions:
  contents: read

concurrency:
  group: desktop-parity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-capture:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'parity-screenshots') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Install Playwright Chromium
        run: bunx playwright install chromium

      - name: Capture web parity surfaces
        env:
          PARITY_WEB_OUT: ${{ github.workspace }}/build/desktop-parity/web
        run: bunx playwright test e2e/parity/desktop-web-parity.spec.ts --project chromium-desktop

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-parity-web
          path: build/desktop-parity/web
          if-no-files-found: error
          retention-days: 30

  macos-capture:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'parity-screenshots') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Capture macOS parity surfaces
        run: bash .github/scripts/record-macos-parity-captures.sh

      # Upload even when the script's post-capture checks fail (for example the
      # title-bar traffic-light check): the PNGs it already wrote are what you
      # need to see why it failed, and to review the surfaces that did capture.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: desktop-parity-macos
          path: build/desktop-parity/macos
          if-no-files-found: error
          retention-days: 30

  compose:
    needs: [web-capture, macos-capture]
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'parity-screenshots') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: desktop-parity-web
          path: build/desktop-parity/web

      - uses: actions/download-artifact@v8
        with:
          name: desktop-parity-macos
          path: build/desktop-parity/macos

      - name: Install Pillow
        run: pip install Pillow

      - name: Compose side-by-side PNGs
        run: |
          python3 .github/scripts/compose-desktop-parity-shots.py \
            --macos-dir build/desktop-parity/macos \
            --web-dir build/desktop-parity/web \
            --out-dir build/desktop-parity/compare

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-parity-compare
          path: build/desktop-parity/compare
          if-no-files-found: error
          retention-days: 90
