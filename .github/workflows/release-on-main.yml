name: Release on main

on:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"

# Two merges landing close together raced on the tag and the deploy; the
# retry loop in tag-release was the only protection. Queue releases instead.
concurrency:
  group: release-on-main
  cancel-in-progress: false

permissions:
  contents: write
  # publish-docker-images.yml exports type=gha layer cache; the reusable
  # workflow cannot request more than the caller grants.
  actions: write

jobs:
  tag-release:
    name: Tag release
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.tag.outputs.release_tag }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Bump patch version and push tag
        id: tag
        run: |
          set -euo pipefail

          max_attempts=5

          for attempt in $(seq 1 "$max_attempts"); do
            git fetch --force --tags origin

            latest=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
            [ -z "$latest" ] && latest="v0.0.0"

            version="${latest#v}"
            major="${version%%.*}"
            rest="${version#*.}"
            minor="${rest%%.*}"
            patch="${rest#*.}"
            release_tag="v${major}.${minor}.$((patch + 1))"

            echo "Attempt ${attempt}/${max_attempts}: bumping ${latest} -> ${release_tag}"

            if git tag "$release_tag" && git push origin "$release_tag"; then
              echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            git tag -d "$release_tag" >/dev/null 2>&1 || true
            sleep "$attempt"
          done

          echo "Could not push a unique release tag after ${max_attempts} attempts." >&2
          exit 1

  publish-docker-images:
    name: Publish Docker images
    needs: tag-release
    uses: ./.github/workflows/publish-docker-images.yml
    with:
      tag: ${{ needs.tag-release.outputs.release_tag }}
    secrets: inherit

  deploy-staging:
    name: Deploy staging
    needs:
      - tag-release
      - publish-docker-images
    uses: ./.github/workflows/deploy-staging.yml
    with:
      tag: ${{ needs.tag-release.outputs.release_tag }}
    secrets: inherit

  # #3814-#3816 failed here (publish-docker-images) on every push for most of
  # a day - a stale boot-size ceiling - and nobody noticed until staging and
  # prod were both several versions behind. Post once, on failure only, so a
  # broken release is loud instead of silent.
  notify-failure:
    name: Notify on failure
    if: failure()
    needs:
      - tag-release
      - publish-docker-images
      - deploy-staging
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Notify Discord
        env:
          DISCORD_ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL }}
        run: |
          failed_job=unknown
          [ "${{ needs.tag-release.result }}" = "failure" ] && failed_job="tag-release"
          [ "${{ needs.publish-docker-images.result }}" = "failure" ] && failed_job="publish-docker-images"
          [ "${{ needs.deploy-staging.result }}" = "failure" ] && failed_job="deploy-staging"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          .github/scripts/discord-notify.sh \
            "Release on main failed: job ${failed_job}, tag ${{ needs.tag-release.outputs.release_tag || 'not tagged' }}. ${run_url}"
