name: Performance budget

# Not a required merge check. Ordinary web PRs used to run two Lighthouse
# profiles x 3 and stall agents watching `gh pr checks` on a red
# non-blocking `lighthouse` job. PRs now run this only when the budget
# itself changes. Main, nightly, and manual dispatch still measure the
# production-shaped bundle.
on:
  workflow_dispatch:
  schedule:
    # 05:15 UTC so the run is not in the top-of-hour scheduled-workflow stampede.
    - cron: "15 5 * * *"
  pull_request:
    branches:
      - main
    paths:
      - ".github/perf/**"
      - ".github/workflows/perf-budget.yml"
  push:
    branches:
      - main
    paths:
      - "apps/calendar-web/**"
      - "packages/core/**"
      - "bun.lock"
      - ".github/perf/**"
      - ".github/workflows/perf-budget.yml"

permissions:
  contents: read

concurrency:
  group: perf-budget-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    # Two Lighthouse profiles x 3 runs each; the mobile profile is the slower
    # of the two. Sized with headroom for a cold npx download of Lighthouse.
    timeout-minutes: 20

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Build web bundle
        env:
          COMPASS_CONFIG_FILE: ${{ github.workspace }}/.github/perf/compass.perf.yaml
        run: |
          cd apps/calendar-web && bun run build.ts

      - name: Serve build with compression
        # `serve` gzips responses the way production Caddy does in front of
        # serve-web.ts; measuring uncompressed delivery would inflate LCP by
        # ~2s and flag the file server instead of the app. It is a
        # devDependency so it comes from the bun install above: the npx
        # download of it missed the 30 s startup window in 29 of 96 runs on
        # 2026-09-03.
        run: |
          bunx serve -s build/web -l 9161 --no-clipboard &
          for _ in $(seq 1 30); do
            if curl -sf -o /dev/null http://localhost:9161/; then exit 0; fi
            sleep 1
          done
          echo "Static server never came up" >&2
          exit 1

      - name: Run Lighthouse budget assertions
        run: |
          bun .github/perf/assert-budget.ts

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: perf-reports
          if-no-files-found: ignore
          retention-days: 14
