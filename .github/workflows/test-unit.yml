name: Unit

on:
  pull_request:
    branches:
      - main
  # Merge queue re-tests the combination against current main. Without this
  # trigger the required checks never run on merge_group and the queue stalls.
  merge_group:
  push:
    branches:
      - main
    paths-ignore:
      - ".gitignore"
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status checks cannot come from a workflow that path filtering
  # skipped: GitHub never creates the check run, so the context sits Pending
  # and a docs-only PR can never merge. A job skipped by an `if:` conditional
  # does report, and reports Success. So for pull_request the filter lives
  # here, as a job gate, not in `on:`. The push trigger keeps its
  # paths-ignore: push runs block nothing.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      code: ${{ steps.filter.outputs.code }}
      core: ${{ steps.filter.outputs.core }}
      web: ${{ steps.filter.outputs.web }}
      backend: ${{ steps.filter.outputs.backend }}
      sync: ${{ steps.filter.outputs.sync }}
      scripts: ${{ steps.filter.outputs.scripts }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Detect non-docs changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/scripts/detect-code-changes.sh \
            "${{ github.event_name }}" \
            "${{ github.repository }}" \
            "${{ github.event.pull_request.number }}"

  # lint, knip, and type-check share node_modules and nothing else. One job
  # with three steps keeps failures attributable without paying checkout /
  # setup-bun / bun install three times. Bun-only: no actions/setup-node.
  static:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        run: |
          bun install --frozen-lockfile

      - name: Run lint
        run: |
          bun run lint

      # Guards against dead-file/dead-export regrowth (scoped to files/exports;
      # dependency and type-only findings are noisier and out of scope here).
      - name: Run knip
        run: |
          bun run knip

      - name: Cache TypeScript incremental build info
        uses: actions/cache@v6
        with:
          path: |
            **/*.tsbuildinfo
          key: ${{ runner.os }}-tsc-${{ hashFiles('bun.lock', 'tsconfig.json', 'tsconfig.typecheck.json', 'packages/**/tsconfig*.json') }}
          restore-keys: |
            ${{ runner.os }}-tsc-${{ hashFiles('bun.lock') }}-

      - name: Run type-check
        run: |
          bun run type-check

      # Workflow files auto-merge under the same size rails as other paths,
      # so they are linted here. Pinned; the image bundles shellcheck for
      # run: steps.
      - name: Lint workflows
        run: |
          docker run --rm -v "${GITHUB_WORKSPACE}:/repo" -w /repo \
            rhysd/actionlint:1.7.7 -color \
            -ignore 'unexpected key "queue" for "concurrency" section'
          # `queue:` is a real concurrency key (_deploy-environment.yml) that
          # this actionlint release does not know yet; drop the ignore on upgrade.

      # The loop scripts' own tests (gh stub, dry-run guard). They need bash 4+.
      # Every *.test.sh runs, rather than a hand-maintained list: the list is
      # what left autofix-pr-watchdog.test.sh unrun from the day it landed,
      # hiding a filter bug the test would have caught. All of them run even
      # if one fails, so a red leg reports every broken script at once.
      - name: Test agent-loop scripts
        run: |
          bash -n .github/scripts/*.sh
          status=0
          for script_test in .github/scripts/*.test.sh; do
            echo "::group::${script_test}"
            bash "${script_test}" || status=1
            echo "::endgroup::"
          done
          exit "${status}"

  # A skipped MATRIX job collapses to one check run, so the `unit` rollup
  # below would see `skipped` for a docs-only PR only if every leg started.
  # Let the legs start and skip every step instead: each reports in a few
  # seconds, for free. Per-package outputs skip unrelated legs the same way
  # (a backend-only PR must not pay two web runners). `unit-leg (web, 1)`
  # and `unit-leg (web, 2)` each cover half the suite as two sequential
  # shards (`WEB_TEST_SHARDS=4` with index `1,2` / `3,4`) so RSS stays
  # under 7 GB.
  unit-leg:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    name: unit-leg (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: core
            project: core
          - name: sync
            project: sync
          - name: web, 1
            project: web
            shard: "1,2"
          - name: web, 2
            project: web
            shard: "3,4"
          - name: backend
            project: backend
          - name: scripts
            project: scripts

    steps:
      - name: Check out Git repository
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs[matrix.project] == 'true' }}
        uses: actions/checkout@v7

      - name: Install Bun
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs[matrix.project] == 'true' }}
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun dependencies
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs[matrix.project] == 'true' }}
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install Dependencies
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs[matrix.project] == 'true' }}
        run: |
          bun install --frozen-lockfile

      # backend and scripts boot an in-memory MongoDB; cache the downloaded
      # mongod binary so each run doesn't re-fetch it.
      - name: Cache MongoDB binaries
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs[matrix.project] == 'true' && (matrix.project == 'backend' || matrix.project == 'scripts' || matrix.project == 'sync') }}
        uses: actions/cache@v6
        with:
          path: ~/.cache/mongodb-binaries
          key: ${{ runner.os }}-mongodb-memory-server

      - name: Run web tests
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs[matrix.project] == 'true' && matrix.project == 'web' }}
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
          WEB_TEST_SHARDS: "4"
          WEB_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: |
          bun run test:web

      # 5 minutes is deliberate, and deliberately not raised. These suites run in
      # seconds on ubuntu-latest - scripts ~5s, backend ~13s, core ~2s, sync
      # ~105s at its slowest - so the budget is already an order of magnitude
      # clear of the slowest of them. When `scripts` tripped this on #3101 it was
      # not slow: every test passed, then the runner sat silent for five minutes
      # because a worker leaked an open Mongo handle and never exited. The same
      # commit re-ran in 5s. Raising the number would only have made that hang
      # cost ten minutes instead of five, while blinding the step to a real
      # regression. The leak itself is not fixed here - see test-mongo-env.ts,
      # which now kills a wedged run at 4 minutes and names the likely cause
      # instead of letting this timeout fire with no output.
      - name: Run ${{ matrix.project }} tests
        if: ${{ needs.changes.outputs.code == 'true' && needs.changes.outputs[matrix.project] == 'true' && matrix.project != 'web' }}
        timeout-minutes: 5
        env:
          TZ: Etc/UTC
        run: |
          bun run test:${{ matrix.project }}

  # One required context for every leg, like `e2e` over `e2e-shard`. Legs can
  # be added, split, or renamed without touching the ruleset: on 2026-09-04
  # the ruleset was updated to new leg names before the workflow that
  # produced them merged, and every PR sat BLOCKED with no bypass actor.
  unit:
    needs: [changes, unit-leg]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every unit leg to pass
        env:
          RESULT: ${{ needs.unit-leg.result }}
        run: |
          echo "unit legs: ${RESULT}"
          case "$RESULT" in
            success|skipped) exit 0 ;;
            *) exit 1 ;;
          esac
