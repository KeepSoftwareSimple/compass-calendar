name: Deploy to environment

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag being deployed, such as v1.2.3'
        required: true
        type: string
      environment:
        description: 'GitHub Environment to deploy to'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ inputs.tag }} to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
      queue: max

    steps:
      - name: Derive image version
        id: version
        run: |
          IMAGE_VERSION="${{ inputs.tag }}"
          IMAGE_VERSION="${IMAGE_VERSION#v}"
          echo "image_version=${IMAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push environment-specific web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile.web
          push: true
          build-args: |
            BASEURL=${{ vars.BACKEND_API_URL }}
            GOOGLE_CLIENT_ID=${{ vars.GOOGLE_CLIENT_ID }}
            MICROSOFT_CLIENT_ID=${{ vars.MICROSOFT_CLIENT_ID }}
            APPLE_SERVICES_ID=${{ vars.APPLE_SIGNIN_SERVICES_ID }}
            POSTHOG_KEY=${{ (inputs.environment == 'production' || inputs.environment == 'staging-cloud') && vars.POSTHOG_KEY || '' }}
            POSTHOG_HOST=${{ (inputs.environment == 'production' || inputs.environment == 'staging-cloud') && vars.POSTHOG_HOST || '' }}
            COMPASS_BUILD_REF=${{ steps.version.outputs.image_version }}
            NODE_ENV=${{ inputs.environment == 'production' && 'production' || 'staging' }}
          tags: switchbacktech/compass-web:${{ inputs.environment }}-${{ steps.version.outputs.image_version }}

      - name: Build and push environment-specific booking-web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/booking-web/Dockerfile
          push: true
          build-args: |
            API_BASEURL=${{ vars.BACKEND_API_URL }}
            NODE_ENV=${{ inputs.environment == 'production' && 'production' || 'staging' }}
          tags: switchbacktech/compass-booking-web:${{ inputs.environment }}-${{ steps.version.outputs.image_version }}

      - name: Deploy release to ${{ inputs.environment }}
        env:
          # Non-sensitive
          BACKEND_API_URL: ${{ vars.BACKEND_API_URL }}
          BOOKING_WEB_IMAGE: switchbacktech/compass-booking-web:${{ inputs.environment }}-${{ steps.version.outputs.image_version }}
          # Production keeps 127.0.0.1:9081 for compass-static (blog), so
          # booking-web binds 9082 there. Caddy's /meet handle must match.
          BOOKING_WEB_PORT: ${{ vars.BOOKING_WEB_PORT || '9082' }}
          COMPOSE_GIT_REF: ${{ vars.COMPOSE_GIT_REF }}
          COMPOSE_PROFILES: ${{ vars.COMPOSE_PROFILES }}
          FRONTEND_URL: ${{ vars.FRONTEND_URL }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          APPLE_SIGNIN_SERVICES_ID: ${{ vars.APPLE_SIGNIN_SERVICES_ID }}
          APPLE_SIGNIN_TEAM_ID: ${{ vars.APPLE_SIGNIN_TEAM_ID }}
          APPLE_SIGNIN_KEY_ID: ${{ vars.APPLE_SIGNIN_KEY_ID }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
          POSTHOG_KEY: ${{ (inputs.environment == 'production' || inputs.environment == 'staging-cloud') && vars.POSTHOG_KEY || '' }}
          POSTHOG_HOST: ${{ (inputs.environment == 'production' || inputs.environment == 'staging-cloud') && vars.POSTHOG_HOST || '' }}
          RELEASE_TAG: ${{ inputs.tag }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          # Sync cutover knobs (optional; omit → enabled/passive defaults).
          SYNC_CLOUD_MUTATION_MODE: ${{ vars.SYNC_CLOUD_MUTATION_MODE }}
          SYNC_EXECUTION: ${{ vars.SYNC_EXECUTION }}
          # Billing operator pause switch (optional; omit → false/paused).
          BILLING_ENFORCEMENT: ${{ vars.BILLING_ENFORCEMENT }}
          # Comma-separated accounts exempt from billing gates. Staging test
          # accounts only; leave unset in production.
          BILLING_BYPASS_EMAILS: ${{ vars.BILLING_BYPASS_EMAILS }}
          WEB_IMAGE: switchbacktech/compass-web:${{ inputs.environment }}-${{ steps.version.outputs.image_version }}
          # Sensitive
          COMPASS_SYNC_TOKEN: ${{ secrets.COMPASS_SYNC_TOKEN }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          MICROSOFT_CLIENT_SECRET: ${{ secrets.MICROSOFT_CLIENT_SECRET }}
          APPLE_SIGNIN_PRIVATE_KEY: ${{ secrets.APPLE_SIGNIN_PRIVATE_KEY }}
          SYNC_CREDENTIAL_ENCRYPTION_KEY: ${{ secrets.SYNC_CREDENTIAL_ENCRYPTION_KEY }}
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_REPLICA_SET_KEY: ${{ secrets.MONGO_REPLICA_SET_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SYNC_INTERNAL_AUTH_TOKEN: ${{ secrets.SYNC_INTERNAL_AUTH_TOKEN }}
          SYNC_MONGO_URI: ${{ secrets.SYNC_MONGO_URI }}
          SUPERTOKENS_KEY: ${{ secrets.SUPERTOKENS_KEY }}
          SUPERTOKENS_POSTGRES_PASSWORD: ${{ secrets.SUPERTOKENS_POSTGRES_PASSWORD }}
          SUPERTOKENS_URI: ${{ secrets.SUPERTOKENS_URI }}
          # Bind Stripe secrets directly. Do not wrap them in
          # `condition && secrets.X || ''` — GitHub blanks secrets used in
          # boolean expressions, which left staging-cloud with no stripe:
          # block even when Environment secrets were set.
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          STRIPE_PRICE_ID: ${{ secrets.STRIPE_PRICE_ID }}
          STRIPE_PUBLISHABLE_KEY: ${{ vars.STRIPE_PUBLISHABLE_KEY }}
          EMAIL_PROVIDER: ${{ vars.EMAIL_PROVIDER }}
          EMAIL_FROM: ${{ vars.EMAIL_FROM }}
          EMAIL_SCHEDULE_PROFILE: ${{ vars.EMAIL_SCHEDULE_PROFILE }}
          EMAIL_ALLOWLIST: ${{ vars.EMAIL_ALLOWLIST }}
          EMAIL_API_KEY: ${{ secrets.EMAIL_API_KEY }}
          EMAIL_WEBHOOK_SECRET: ${{ secrets.EMAIL_WEBHOOK_SECRET }}
          EMAIL_UNSUBSCRIBE_SECRET: ${{ secrets.EMAIL_UNSUBSCRIBE_SECRET }}
        run: |
          echo "Deploying Compass ${RELEASE_TAG} (image version: ${IMAGE_VERSION}) to ${{ inputs.environment }}"
          # Only "production" ever runs the production runtime.nodeEnv; every
          # other GitHub Environment (staging-cloud, staging-selfhosted, ...)
          # is "staging". This used to be hardcoded to "production"
          # unconditionally, so staging told its own telemetry it was
          # production and polluted any prod-scoped alert or dashboard
          # (2026-08-01).
          if [ "${{ inputs.environment }}" = "production" ]; then
            NODE_ENV="production"
          else
            NODE_ENV="staging"
          fi
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/staging_key
          chmod 600 ~/.ssh/staging_key
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
          # Sync is required on every deploy: the backend hard-requires
          # SYNC_SERVICE_URL + SYNC_INTERNAL_AUTH_TOKEN at startup (#2480) and
          # there is no legacy in-backend engine to fall back to. Fail early
          # with a clear message rather than writing a compass.yaml the
          # backend will reject after compose starts.
          if [ -z "$SYNC_INTERNAL_AUTH_TOKEN" ]; then
            echo "Deploy requires SYNC_INTERNAL_AUTH_TOKEN." >&2
            exit 1
          fi
          # New provider credentials are encrypted at rest (#3368), so the sync
          # service throws on every new calendar connection when this key is
          # missing while existing connections keep syncing. That silent
          # partial outage reached production in #3687; fail the deploy instead.
          if [ -z "$SYNC_CREDENTIAL_ENCRYPTION_KEY" ]; then
            echo "Deploy requires SYNC_CREDENTIAL_ENCRYPTION_KEY (32 bytes of base64, generate with: openssl rand -base64 32)." >&2
            exit 1
          fi
          # Cloud uses an isolated Atlas sync DB (SYNC_MONGO_URI secret) with
          # a scoped user, so least-privilege enforcement stays on. Selfhosted
          # reuses the bundled mongo's compass_sync database — same derived
          # URI as install.sh / compass.example.yaml — and turns enforcement
          # off because the bundled image has no separate sync DB user.
          SYNC_ENFORCE_LEAST_PRIVILEGE="true"
          if [ -z "$SYNC_MONGO_URI" ]; then
            case ",${COMPOSE_PROFILES}," in
              *,selfhosted,*)
                if [ -z "$MONGO_PASSWORD" ]; then
                  echo "Selfhosted sync requires MONGO_PASSWORD to derive sync.mongoUri." >&2
                  exit 1
                fi
                SYNC_MONGO_URI="mongodb://compass:${MONGO_PASSWORD}@mongo:27017/compass_sync?authSource=admin&replicaSet=rs0"
                SYNC_ENFORCE_LEAST_PRIVILEGE="false"
                ;;
              *)
                echo "Cloud deploy requires SYNC_MONGO_URI." >&2
                exit 1
                ;;
            esac
          fi
          {
            printf '%s\n' \
              'runtime:' \
              "  version: \"${IMAGE_VERSION}\"" \
              "  nodeEnv: ${NODE_ENV}" \
              '  timezone: Etc/UTC' \
              'web:' \
              '  port: 9080' \
              "  url: \"${FRONTEND_URL}\"" \
              "  image: \"${WEB_IMAGE}\"" \
              'bookingWeb:' \
              "  port: ${BOOKING_WEB_PORT}" \
              "  image: \"${BOOKING_WEB_IMAGE}\"" \
              'backend:' \
              '  port: 3000' \
              "  apiUrl: \"${BACKEND_API_URL}\"" \
              '  originsAllowed:' \
              "    - \"${FRONTEND_URL}\"" \
              "  compassToken: \"${COMPASS_SYNC_TOKEN}\"" \
              'mongo:' \
              '  username: compass' \
              "  password: \"${MONGO_PASSWORD}\"" \
              ${MONGO_REPLICA_SET_KEY:+"  replicaSetKey: \"${MONGO_REPLICA_SET_KEY}\""} \
              "  uri: \"${MONGO_URI}\"" \
              'supertokens:' \
              "  uri: \"${SUPERTOKENS_URI}\"" \
              "  key: \"${SUPERTOKENS_KEY}\"" \
              ${SUPERTOKENS_POSTGRES_PASSWORD:+'  postgres:'} \
              ${SUPERTOKENS_POSTGRES_PASSWORD:+'    user: supertokens'} \
              ${SUPERTOKENS_POSTGRES_PASSWORD:+"    password: \"${SUPERTOKENS_POSTGRES_PASSWORD}\""} \
              ${SUPERTOKENS_POSTGRES_PASSWORD:+'    database: supertokens'} \
              'google:' \
              "  clientId: \"${GOOGLE_CLIENT_ID}\"" \
              "  clientSecret: \"${GOOGLE_CLIENT_SECRET}\""
            if [ -n "$MICROSOFT_CLIENT_ID" ] && [ -n "$MICROSOFT_CLIENT_SECRET" ]; then
              printf '%s\n' \
                'microsoft:' \
                "  clientId: \"${MICROSOFT_CLIENT_ID}\"" \
                "  clientSecret: \"${MICROSOFT_CLIENT_SECRET}\""
            fi
            if [ -n "$APPLE_SIGNIN_SERVICES_ID" ] && [ -n "$APPLE_SIGNIN_TEAM_ID" ] &&
              [ -n "$APPLE_SIGNIN_KEY_ID" ] && [ -n "$APPLE_SIGNIN_PRIVATE_KEY" ]; then
              # PEM keys contain newlines; encode them for a double-quoted yaml scalar.
              APPLE_PK_YAML=$(python3 -c 'import os, json; print(json.dumps(os.environ["APPLE_SIGNIN_PRIVATE_KEY"])[1:-1])')
              printf '%s\n' \
                'apple:' \
                '  signIn:' \
                "    servicesId: \"${APPLE_SIGNIN_SERVICES_ID}\"" \
                "    teamId: \"${APPLE_SIGNIN_TEAM_ID}\"" \
                "    keyId: \"${APPLE_SIGNIN_KEY_ID}\"" \
                "    privateKey: \"${APPLE_PK_YAML}\""
            fi
            if [ -n "$POSTHOG_KEY" ] && [ -n "$POSTHOG_HOST" ]; then
              printf '%s\n' \
                'posthog:' \
                "  key: \"${POSTHOG_KEY}\"" \
                "  host: \"${POSTHOG_HOST}\""
            fi
            # Hosted cloud only. staging-selfhosted must omit this block even
            # if a repo-level STRIPE_* secret exists. Log to stderr — this
            # group is piped into compass.yaml.
            if { [ "${{ inputs.environment }}" = "production" ] || [ "${{ inputs.environment }}" = "staging-cloud" ]; } &&
              [ -n "$STRIPE_SECRET_KEY" ] && [ -n "$STRIPE_WEBHOOK_SECRET" ] && [ -n "$STRIPE_PRICE_ID" ] && [ -n "$STRIPE_PUBLISHABLE_KEY" ]; then
              echo "Stripe config: writing stripe block (all four values present)" >&2
              printf '%s\n' \
                'stripe:' \
                "  secretKey: \"${STRIPE_SECRET_KEY}\"" \
                "  webhookSecret: \"${STRIPE_WEBHOOK_SECRET}\"" \
                "  priceId: \"${STRIPE_PRICE_ID}\"" \
                "  publishableKey: \"${STRIPE_PUBLISHABLE_KEY}\""
            else
              echo "Stripe config: omitting stripe block (environment=${{ inputs.environment }}; secretKey=$([ -n "$STRIPE_SECRET_KEY" ] && echo present || echo empty); webhookSecret=$([ -n "$STRIPE_WEBHOOK_SECRET" ] && echo present || echo empty); priceId=$([ -n "$STRIPE_PRICE_ID" ] && echo present || echo empty); publishableKey=$([ -n "$STRIPE_PUBLISHABLE_KEY" ] && echo present || echo empty))" >&2
            fi
            # Billing operator knobs (both optional; omit → schema defaults of
            # enforcement false + empty bypass list). The block header is
            # written when either var is set.
            if [ -n "$BILLING_ENFORCEMENT" ] || [ -n "$BILLING_BYPASS_EMAILS" ]; then
              printf '%s\n' 'billing:'
              if [ -n "$BILLING_ENFORCEMENT" ]; then
                printf '%s\n' "  enforcement: ${BILLING_ENFORCEMENT}"
              fi
              if [ -n "$BILLING_BYPASS_EMAILS" ]; then
                # Comma-separated var → yaml flow sequence of quoted strings.
                bypass_seq=$(printf '%s' "$BILLING_BYPASS_EMAILS" |
                  tr ',' '\n' |
                  sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e '/^$/d' -e 's/.*/"&"/' |
                  paste -sd, -)
                printf '%s\n' "  bypassEmails: [${bypass_seq}]"
                echo "Billing config: ${BILLING_BYPASS_EMAILS} on the bypass allowlist" >&2
              fi
            fi
            # Hosted cloud only. staging-selfhosted must omit this block even
            # when repo-level email secrets exist. Log to stderr — this group
            # is piped into compass.yaml.
            if { [ "${{ inputs.environment }}" = "production" ] || [ "${{ inputs.environment }}" = "staging-cloud" ]; }; then
              # shellcheck source=.github/scripts/deploy-write-email-block.sh
              . .github/scripts/deploy-write-email-block.sh
              write_email_block
            else
              echo "Email config: omitting email block (environment=${{ inputs.environment }})" >&2
            fi
            printf '%s\n' \
              'sync:' \
              "  mongoUri: \"${SYNC_MONGO_URI}\"" \
              "  internalAuthToken: \"${SYNC_INTERNAL_AUTH_TOKEN}\"" \
              "  callbackBaseUrl: \"${FRONTEND_URL}\"" \
              '  serviceUrl: "http://sync:3010"' \
              "  enforceLeastPrivilege: ${SYNC_ENFORCE_LEAST_PRIVILEGE}" \
              '  maxConcurrency: 12'
            # Optional per-environment execution/mutation-mode knobs (GitHub
            # Environment vars). Empty → schema defaults (enabled / passive).
            if [ -n "$SYNC_CLOUD_MUTATION_MODE" ]; then
              printf '%s\n' "  cloudMutationMode: \"${SYNC_CLOUD_MUTATION_MODE}\""
            fi
            if [ -n "$SYNC_EXECUTION" ]; then
              printf '%s\n' "  execution: \"${SYNC_EXECUTION}\""
            fi
            printf '%s\n' "  credentialEncryptionKey: \"${SYNC_CREDENTIAL_ENCRYPTION_KEY}\""
          } | ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" \
                "umask 077 && mkdir -p ~/compass && cat > ~/compass/compass.yaml && chmod 644 ~/compass/compass.yaml"
          COMPOSE_GIT_REF="${COMPOSE_GIT_REF:-main}"
          SELF_HOST_REPO="${GITHUB_REPOSITORY}"
          compose_url="https://raw.githubusercontent.com/${SELF_HOST_REPO}/${COMPOSE_GIT_REF}/self-host/compose.yaml"
          if ! curl -fsSL "$compose_url" -o /dev/null; then
            echo "Could not fetch self-host files from ${SELF_HOST_REPO}@${COMPOSE_GIT_REF}; falling back to ${RELEASE_TAG}."
            COMPOSE_GIT_REF="${RELEASE_TAG}"
          fi
          ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" "curl -fsSL https://raw.githubusercontent.com/${SELF_HOST_REPO}/${COMPOSE_GIT_REF}/self-host/compose.yaml -o ~/compass/compose.yaml"
          ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" "curl -fsSL https://raw.githubusercontent.com/${SELF_HOST_REPO}/${COMPOSE_GIT_REF}/self-host/compose.selfhosted.yaml -o ~/compass/compose.selfhosted.yaml"
          # Install the shared parser before the helper that sources it. Each
          # download is promoted atomically so a network failure leaves the
          # previously working helper untouched.
          ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" "curl -fsSL https://raw.githubusercontent.com/${SELF_HOST_REPO}/${COMPOSE_GIT_REF}/self-host/config.sh -o ~/compass/config.sh.$$ && mv ~/compass/config.sh.$$ ~/compass/config.sh"
          ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" "curl -fsSL https://raw.githubusercontent.com/${SELF_HOST_REPO}/${COMPOSE_GIT_REF}/self-host/compass -o ~/compass/compass.$$ && chmod +x ~/compass/compass.$$ && mv ~/compass/compass.$$ ~/compass/compass"
          # Always enable the booking and sync profiles: their config is always
          # written above, and an explicit COMPOSE_PROFILES var (e.g.
          # `selfhosted`) would otherwise override the helper's
          # default_profiles() and leave them unstarted.
          DEPLOY_PROFILES="${COMPOSE_PROFILES:+${COMPOSE_PROFILES},}booking,sync"
          ssh -i ~/.ssh/staging_key "$SSH_USER@$SSH_HOST" "cd ~/compass && COMPOSE_PROFILES='${DEPLOY_PROFILES}' ./compass update"
