name: Staging journey

# Nightly full user-journey smoke against staging only. Never targets production.
on:
  workflow_dispatch:
    inputs:
      artifact_probe:
        description: Run signup-only artifact and cleanup probe (one synthetic account)
        type: boolean
        default: false
  schedule:
    - cron: "40 7 * * *"

permissions:
  contents: read

concurrency:
  group: staging-journey
  cancel-in-progress: true

jobs:
  journey:
    name: "staging journey (${{ matrix.provider }})"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        provider: [google, microsoft, apple]
    environment: staging-journey
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run staging journey leg
        env:
          DISCORD_ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL }}
          STAGING_JOURNEY_ARTIFACT_PROBE: ${{ inputs.artifact_probe == true && '1' || '' }}
          STAGING_JOURNEY_PROVIDER: ${{ matrix.provider }}
          STAGING_JOURNEY_GOOGLE_EMAIL: ${{ secrets.STAGING_JOURNEY_GOOGLE_EMAIL }}
          STAGING_JOURNEY_GOOGLE_PASSWORD: ${{ secrets.STAGING_JOURNEY_GOOGLE_PASSWORD }}
          STAGING_JOURNEY_MICROSOFT_EMAIL: ${{ secrets.STAGING_JOURNEY_MICROSOFT_EMAIL }}
          STAGING_JOURNEY_MICROSOFT_PASSWORD: ${{ secrets.STAGING_JOURNEY_MICROSOFT_PASSWORD }}
          STAGING_JOURNEY_APPLE_EMAIL: ${{ secrets.STAGING_JOURNEY_APPLE_EMAIL }}
          STAGING_JOURNEY_APPLE_PASSWORD: ${{ secrets.STAGING_JOURNEY_APPLE_PASSWORD }}
        run: bash .github/scripts/staging-journey.sh

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-journey-${{ matrix.provider }}-${{ github.run_id }}
          path: e2e/test-results/staging-journey/
          retention-days: 14
          if-no-files-found: warn

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL }}
        run: |
          bash .github/scripts/discord-notify.sh \
            "staging-journey failed for ${{ matrix.provider }}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
