name: Deploy production

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag being deployed, such as v1.2.3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify-failure:
    name: Notify on failure
    if: failure()
    needs:
      - deploy
      - health-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Notify Discord
        env:
          DISCORD_ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL }}
        run: |
          failed_job=unknown
          [ "${{ needs.deploy.result }}" = "failure" ] && failed_job="deploy"
          [ "${{ needs.health-check.result }}" = "failure" ] && failed_job="health-check"
          run_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          .github/scripts/discord-notify.sh \
            "Deploy production failed: job ${failed_job}, tag ${{ inputs.tag }}. ${run_url}"

  deploy:
    name: Deploy to production
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      tag: ${{ inputs.tag }}
      environment: production
    secrets: inherit

  health-check:
    name: Health check production
    needs: deploy
    uses: ./.github/workflows/deploy-health-check.yml
    with:
      tag: ${{ inputs.tag }}
      environment: production
      profile: cloud
    secrets: inherit
