name: macOS

# Builds and tests the Swift app in apps/calendar-macos
# (docs/features/desktop-client.md). Agents work on Linux and cannot compile
# AppKit, so this workflow is the only place that project builds before a
# release.
on:
  pull_request:
    branches:
      - main
  # Merge queue re-tests the combination against current main. Without this
  # trigger the required `macos` check never reports on merge_group and the
  # queue stalls.
  merge_group:
  # No `push: main` trigger. The merge queue already tested exactly the tree
  # that lands (squash), release-macos-dev.yml builds every main push touching
  # the app, and the agent-loop merge guard does not read this workflow. A
  # post-merge run was a duplicate full UI suite (about 15 macOS minutes) per
  # merged PR, and it queued behind the PRs still waiting to merge.
  workflow_dispatch:
    inputs:
      strict_verify:
        description: Run full strict verification on an isolated Mac
        type: boolean
        default: false
      diagnose_web_only:
        description: Temporary title-focus diagnosis, not full strict acceptance
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same job-gate pattern as test-unit.yml: the required `macos` context must
  # report on every PR and merge group, so path filtering lives here and not
  # in `on:`. macOS runner minutes cost ten times Linux ones, so unlike
  # test-unit.yml the merge queue also filters: a group that touches nothing
  # here skips the build. No project yet (apps/calendar-macos/project.yml
  # absent) also skips.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Detect apps/calendar-macos changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ ! -f apps/calendar-macos/project.yml ]; then
            echo "No apps/calendar-macos/project.yml; nothing to build."
            echo "macos=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                --jq '.[].filename') || files="" ;;
            merge_group)
              files=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
                --jq '.files[].filename') || files="" ;;
            *)
              echo "macos=true" >>"$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # An unreadable or empty file list is unverified, so build.
          if [ -z "$files" ]; then
            echo "Could not read changed files; building."
            echo "macos=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          hits=$(printf '%s\n' "$files" |
            grep -E '^(apps/calendar-macos/|\.github/workflows/test-macos\.yml$)' || true)
          if [ -n "$hits" ]; then
            printf 'macOS changes:\n%s\n' "$hits"
            echo "macos=true" >>"$GITHUB_OUTPUT"
          else
            echo "No apps/calendar-macos changes."
            echo "macos=false" >>"$GITHUB_OUTPUT"
          fi

  swift-packages:
    needs: changes
    if: needs.changes.outputs.macos == 'true' && !inputs.strict_verify
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Cache SwiftPM build directories
        uses: actions/cache@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ runner.os }}-swift-pkgs-v1-${{ hashFiles('apps/calendar-macos/CompassKit/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassUI/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-pkgs-v1-
            ${{ runner.os }}-swift-pkgs-

      - name: Test native Swift packages
        run: bash .github/scripts/test-macos-swift-packages.sh

  build:
    needs: changes
    if: needs.changes.outputs.macos == 'true' && !inputs.strict_verify
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/calendar-macos
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Render app icon
        run: bash ../../.github/scripts/render-macos-icon.sh

      - name: Cache SwiftPM and derived data
        uses: actions/cache@v6
        with:
          path: |
            apps/calendar-macos/build/DerivedData
            apps/calendar-macos/build/SourcePackages
          # Bump when SPM binary artifacts (Sparkle) change; stale DerivedData can
          # skip ProcessXCFramework and break the embed copy step.
          key: ${{ runner.os }}-xcode-sparkle-v1-${{ hashFiles('apps/calendar-macos/project.yml', 'apps/calendar-macos/**/Package.swift', 'apps/calendar-macos/**/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-xcode-

      - name: Generate Xcode project
        run: |
          xcodegen generate

      # The Compass scheme runs CompassKitTests and CompassUITests.
      - name: Build and test
        run: |
          xcodebuild -version
          xcodebuild test \
            -project Compass.xcodeproj \
            -scheme Compass \
            -destination platform=macOS \
            -derivedDataPath build/DerivedData \
            -clonedSourcePackagesDirPath build/SourcePackages \
            -resultBundlePath build/Compass.xcresult

      # Window snapshots from NativeImageSnapshotTests and the screen
      # recordings of failing UI tests, named by test, so a PR's UI can be
      # reviewed from the artifact without Xcode or a local Mac.
      - name: Export UI test screenshots
        if: ${{ !cancelled() }}
        run: bash ../../.github/scripts/export-macos-screenshots.sh build/Compass.xcresult build/screenshots

      - name: Upload UI test screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-screenshots
          path: apps/calendar-macos/build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      # Unsigned, ad hoc signed Debug build for manual checks: unzip, then
      # right-click Compass.app → Open. Signed releases are release-macos.yml.
      - name: Zip the app
        run: |
          ditto -c -k --keepParent build/DerivedData/Build/Products/Debug/Compass.app build/Compass.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-app
          path: apps/calendar-macos/build/Compass.zip
          retention-days: 14

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-xcresult
          path: apps/calendar-macos/build/Compass.xcresult
          retention-days: 7

  strict:
    if: github.event_name == 'workflow_dispatch' && inputs.strict_verify && !inputs.diagnose_web_only
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Render app icon
        run: bash .github/scripts/render-macos-icon.sh
      - name: Restore SwiftPM build directories
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ runner.os }}-swift-pkgs-v1-${{ hashFiles('apps/calendar-macos/CompassKit/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassUI/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-pkgs-v1-
            ${{ runner.os }}-swift-pkgs-

      # Save compilation before the long UI pass, even if that pass later stops.
      # The strict verifier still executes every test in its existing order.
      - name: Build SwiftPM test binaries on a cache miss
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          for package in CompassKit CompassData CompassUI; do
            swift build --package-path "apps/calendar-macos/${package}" --build-tests
          done

      - name: Save SwiftPM test binaries
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Verify Swift contracts and desktop exports
        run: |
          bun cli contracts:swift --check
          bun cli desktop:export --check
      - name: Run full strict verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          bun run verify --strict --serial macos | tee build/macos-strict.log
      - name: Upload strict verification log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-strict-log
          path: build/macos-strict.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload strict native test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-strict-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/Compass-*/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7

  strict-web:
    if: github.event_name == 'workflow_dispatch' && inputs.strict_verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Match normal E2E's browser dependencies instead of reinstalling the
    # entire browser OS stack on each strict Ubuntu runner.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install Bun
        run: npm install --global --no-audit --no-fund bun@1.3.14
      - name: Install dependencies
        run: bun install
      - name: Install Playwright Chromium
        run: bunx playwright install chromium
      - name: Run full web strict verification
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build
          # Temporary #5039 evidence: verifier buffers child output until exit.
          touch build/title-focus.log
          tail -n +1 -f build/title-focus.log &
          focus_log_tail=$!
          trap 'kill "$focus_log_tail" 2>/dev/null || true' EXIT
          COMPASS_TITLE_FOCUS_LOG="$PWD/build/title-focus.log" \
            bun run verify --strict web | tee build/web-strict.log
      - name: Upload web strict verification log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compass-web-strict-log
          path: build/web-strict.log
          if-no-files-found: warn
          retention-days: 14

      - name: Retain failed web strict Playwright evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compass-web-strict-playwright-failure
          path: test-results/
          if-no-files-found: warn
          retention-days: 14

  # One required context whether or not the build ran, like `unit` over
  # `unit-leg`. `changes` must succeed too: a failed filter skips `build`,
  # and a skipped build alone would read as a pass.
  macos:
    needs: [changes, build, swift-packages, strict, strict-web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the macOS build to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.build.result }}
          SWIFT_PACKAGES: ${{ needs.swift-packages.result }}
          STRICT: ${{ needs.strict.result }}
          STRICT_WEB: ${{ needs.strict-web.result }}
          STRICT_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_verify }}
        run: |
          echo "changes: ${CHANGES}, build: ${BUILD}, swift-packages: ${SWIFT_PACKAGES}"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$STRICT_REQUESTED" = "true" ]; then
            [ "$STRICT" = "success" ] && [ "$STRICT_WEB" = "success" ] || exit 1
          fi
          for leg in "$BUILD" "$SWIFT_PACKAGES" "$STRICT" "$STRICT_WEB"; do
            case "$leg" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
