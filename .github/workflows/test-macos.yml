name: macOS

# Builds and tests the Swift app in apps/calendar-macos
# (docs/features/desktop-client.md). Agents work on Linux and cannot compile
# AppKit, so this workflow is the only place that project builds before a
# release.
on:
  pull_request:
    branches:
      - main
  # Merge queue re-tests the combination against current main. Without this
  # trigger the required `macos` check never reports on merge_group and the
  # queue stalls.
  merge_group:
  # No `push: main` trigger. The merge queue already tested exactly the tree
  # that lands (squash), release-macos-dev.yml builds every main push touching
  # the app, and the agent-loop merge guard does not read this workflow. A
  # post-merge run was a duplicate full UI suite (about 15 macOS minutes) per
  # merged PR, and it queued behind the PRs still waiting to merge.
  workflow_dispatch:
    inputs:
      strict_verify:
        description: Run full strict verification on an isolated Mac
        type: boolean
        default: false
      hidden_events_stress_iterations:
        description: Repeat HiddenEventsStore superseded test N times (0=skip)
        type: number
        default: 0

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Same job-gate pattern as test-unit.yml: the required `macos` context must
  # report on every PR and merge group, so path filtering lives here and not
  # in `on:`. macOS runner minutes cost ten times Linux ones, so unlike
  # test-unit.yml the merge queue also filters: a group that touches nothing
  # here skips the build. No project yet (apps/calendar-macos/project.yml
  # absent) also skips.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      macos: ${{ steps.filter.outputs.macos }}
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Detect apps/calendar-macos changes
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_SHA: ${{ github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.merge_group.head_sha }}
        run: |
          if [ ! -f apps/calendar-macos/project.yml ]; then
            echo "No apps/calendar-macos/project.yml; nothing to build."
            echo "macos=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          case "$EVENT" in
            pull_request)
              files=$(gh api --paginate "repos/${REPO}/pulls/${PR_NUMBER}/files" \
                --jq '.[].filename') || files="" ;;
            merge_group)
              files=$(gh api "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" \
                --jq '.files[].filename') || files="" ;;
            *)
              if [ "$EVENT" = "workflow_dispatch" ] \
                && [ "${{ inputs.hidden_events_stress_iterations }}" != "0" ] \
                && [ "${{ inputs.strict_verify }}" != "true" ]; then
                echo "Hidden-events stress dispatch; skip full macOS matrix."
                echo "macos=false" >>"$GITHUB_OUTPUT"
                exit 0
              fi
              echo "macos=true" >>"$GITHUB_OUTPUT"
              exit 0 ;;
          esac
          # An unreadable or empty file list is unverified, so build.
          if [ -z "$files" ]; then
            echo "Could not read changed files; building."
            echo "macos=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          hits=$(printf '%s\n' "$files" |
            grep -E '^(apps/calendar-macos/|\.github/workflows/test-macos\.yml$)' || true)
          if [ -n "$hits" ]; then
            printf 'macOS changes:\n%s\n' "$hits"
            echo "macos=true" >>"$GITHUB_OUTPUT"
          else
            echo "No apps/calendar-macos changes."
            echo "macos=false" >>"$GITHUB_OUTPUT"
          fi

  hidden-events-stress:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.hidden_events_stress_iterations > 0
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Stress HiddenEventsStore superseded test
        run: >-
          bash .github/scripts/test-hidden-events-store-stress.sh
          "${{ inputs.hidden_events_stress_iterations }}"

  # After macos-build so a compile failure never keeps this job on a second Mac
  # slot. Critical path stays build, then max(shards, swift-packages): shards and
  # swift-packages both need macos-build and run in parallel afterward.
  swift-packages:
    needs: [changes, macos-build]
    if: >-
      needs.changes.outputs.macos == 'true' &&
      needs.macos-build.result == 'success' &&
      !inputs.strict_verify
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Cache SwiftPM build directories
        id: swift-pkgs-cache
        uses: actions/cache@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ runner.os }}-swift-pkgs-v1-${{ hashFiles('apps/calendar-macos/CompassKit/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassUI/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-pkgs-v1-
            ${{ runner.os }}-swift-pkgs-

      - name: Test native Swift packages
        env:
          # CompassKit XCTest cases also run in macos-build (xcodebuild
          # -only-testing:CompassKitTests); see test-macos-swift-packages.sh.
          MACOS_SWIFT_PACKAGES_INCLUDE_COMPASSKIT: "0"
          MACOS_SWIFT_PACKAGES_SKIP_BUILD: ${{ steps.swift-pkgs-cache.outputs.cache-hit == 'true' && '1' || '0' }}
        run: bash .github/scripts/test-macos-swift-packages.sh

      - name: Stress HiddenEventsStore superseded test (50x)
        if: >-
          github.event_name == 'pull_request' &&
          (github.head_ref == 'cursor/hidden-events-superseded-test-8feb' ||
           github.head_ref == 'cursor/meeting-copy-keycap-8feb')
        run: bash .github/scripts/test-hidden-events-store-stress.sh 50

  macos-build:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/calendar-macos
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: |
          brew install xcodegen

      - name: Render app icon
        run: bash ../../.github/scripts/render-macos-icon.sh

      - name: Restore SwiftPM package build cache for swift-packages
        id: swift-pkgs-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ runner.os }}-swift-pkgs-v1-${{ hashFiles('apps/calendar-macos/CompassKit/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassUI/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-pkgs-v1-
            ${{ runner.os }}-swift-pkgs-

      - name: Cache SwiftPM and derived data
        uses: actions/cache@v6
        with:
          path: |
            apps/calendar-macos/build/DerivedData
            apps/calendar-macos/build/SourcePackages
          # Bump when SPM binary artifacts (Sparkle) change; stale DerivedData can
          # skip ProcessXCFramework and break the embed copy step.
          key: ${{ runner.os }}-xcode-sparkle-v2-${{ hashFiles('apps/calendar-macos/project.yml', 'apps/calendar-macos/**/Package.swift', 'apps/calendar-macos/**/Package.resolved', 'apps/calendar-macos/CompassUITests/**', 'apps/calendar-macos/Compass/**', 'apps/calendar-macos/CompassUI/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassKit/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-sparkle-v2-
            ${{ runner.os }}-xcode-

      - name: Build for testing and run CompassKitTests
        run: |
          xcodebuild -version
          if [ "${{ steps.swift-pkgs-cache.outputs.cache-hit }}" != 'true' ]; then
            bash ../../.github/scripts/warm-macos-swift-pkg-cache.sh &
            warm_pid=$!
          fi
          bash ../../.github/scripts/test-macos-build-for-testing.sh
          if [ -n "${warm_pid:-}" ]; then
            wait "$warm_pid"
          fi

      - name: Save SwiftPM package build cache
        if: steps.swift-pkgs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ steps.swift-pkgs-cache.outputs.cache-primary-key }}

      # Unsigned, ad hoc signed Debug build for manual checks: unzip, then
      # right-click Compass.app → Open. Signed releases are release-macos.yml.
      - name: Zip the app
        run: |
          ditto -c -k --keepParent build/DerivedData/Build/Products/Debug/Compass.app build/Compass.zip

      - name: Upload the app
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-app
          path: apps/calendar-macos/build/Compass.zip
          retention-days: 14

  # Four parallel legs over CompassUITests (hand-balanced in macos-ui-shards.json).
  # Each leg restores the same DerivedData cache as macos-build and runs
  # test-without-building with -only-testing filters. Critical path is the
  # slowest shard, not the sum of serial class time.
  macos-ui-shard:
    needs: [changes, macos-build]
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        working-directory: apps/calendar-macos
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Render app icon
        run: bash ../../.github/scripts/render-macos-icon.sh

      - name: Restore SwiftPM and derived data
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/calendar-macos/build/DerivedData
            apps/calendar-macos/build/SourcePackages
          key: ${{ runner.os }}-xcode-sparkle-v2-${{ hashFiles('apps/calendar-macos/project.yml', 'apps/calendar-macos/**/Package.swift', 'apps/calendar-macos/**/Package.resolved', 'apps/calendar-macos/CompassUITests/**', 'apps/calendar-macos/Compass/**', 'apps/calendar-macos/CompassUI/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassKit/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-sparkle-v2-
            ${{ runner.os }}-xcode-

      - name: Run UI test shard
        env:
          MACOS_UI_SHARD: ${{ matrix.shard }}
          MACOS_XCRESULT_PATH: build/Compass-shard-${{ matrix.shard }}.xcresult
        run: bash ../../.github/scripts/macos-ui-shard-test.sh

      - name: Export UI test screenshots
        if: ${{ !cancelled() && matrix.shard == 1 }}
        run: bash ../../.github/scripts/export-macos-screenshots.sh build/Compass-shard-1.xcresult build/screenshots

      - name: Upload UI test screenshots
        if: ${{ !cancelled() && matrix.shard == 1 }}
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-screenshots
          path: apps/calendar-macos/build/screenshots
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload shard test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-xcresult-shard-${{ matrix.shard }}
          path: apps/calendar-macos/build/Compass-shard-${{ matrix.shard }}.xcresult
          if-no-files-found: ignore
          retention-days: 7

  strict:
    if: github.event_name == 'workflow_dispatch' && inputs.strict_verify
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Render app icon
        run: bash .github/scripts/render-macos-icon.sh
      - name: Restore SwiftPM and derived data
        id: xcode-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/calendar-macos/build/DerivedData
            apps/calendar-macos/build/SourcePackages
          key: ${{ runner.os }}-xcode-sparkle-v2-${{ hashFiles('apps/calendar-macos/project.yml', 'apps/calendar-macos/**/Package.swift', 'apps/calendar-macos/**/Package.resolved', 'apps/calendar-macos/CompassUITests/**', 'apps/calendar-macos/Compass/**', 'apps/calendar-macos/CompassUI/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassKit/**') }}
          restore-keys: |
            ${{ runner.os }}-xcode-sparkle-v2-
            ${{ runner.os }}-xcode-
      - name: Restore SwiftPM build directories
        id: swift-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ runner.os }}-swift-pkgs-v1-${{ hashFiles('apps/calendar-macos/CompassKit/**', 'apps/calendar-macos/CompassData/**', 'apps/calendar-macos/CompassUI/**') }}
          restore-keys: |
            ${{ runner.os }}-swift-pkgs-v1-
            ${{ runner.os }}-swift-pkgs-

      # Save compilation before the long UI pass, even if that pass later stops.
      # The strict verifier still executes every test in its existing order.
      - name: Build SwiftPM test binaries on a cache miss
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          for package in CompassKit CompassData CompassUI; do
            swift build --package-path "apps/calendar-macos/${package}" --build-tests
          done

      - name: Save SwiftPM test binaries
        if: steps.swift-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            apps/calendar-macos/CompassKit/.build
            apps/calendar-macos/CompassData/.build
            apps/calendar-macos/CompassUI/.build
          key: ${{ steps.swift-cache.outputs.cache-primary-key }}

      - name: Verify Swift contracts and desktop exports
        run: |
          bun cli contracts:swift --check
          bun cli desktop:export --check
      - name: Run full strict verification
        shell: bash
        env:
          CI_MACOS_UI_SHARDED: "1"
        run: |
          set -o pipefail
          mkdir -p build
          bun run verify --strict --serial macos | tee build/macos-strict.log
      - name: Save SwiftPM and derived data
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            apps/calendar-macos/build/DerivedData
            apps/calendar-macos/build/SourcePackages
          key: ${{ steps.xcode-cache.outputs.cache-primary-key }}
      - name: Upload strict verification log
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-strict-log
          path: build/macos-strict.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload strict native test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: compass-macos-strict-xcresult
          path: ~/Library/Developer/Xcode/DerivedData/Compass-*/Logs/Test/*.xcresult
          if-no-files-found: warn
          retention-days: 7

  # Web strict verification split like test-unit (web shards) and test-e2e
  # (directory shards). macOS strict already runs type-check, lint, and knip.
  # E2E legs run inside the Playwright Docker image (see test-e2e.yml): a plain
  # ubuntu-latest leg that runs `playwright install --with-deps` can spend most
  # of the 15-minute job budget in apt before tests start (observed on strict
  # BOTH run 42278445367: e2e/timed cancelled after 13 tests while downloading
  # font packages).
  strict-web-leg-web:
    if: github.event_name == 'workflow_dispatch' && inputs.strict_verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: web-1
            shard: "1"
          - leg: web-2
            shard: "2"
          - leg: web-3
            shard: "3"
          - leg: web-4
            shard: "4"
          - leg: web-5
            shard: "5"
          - leg: web-6
            shard: "6"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Install dependencies
        run: bun install
      - name: Run web test shard
        env:
          WEB_TEST_SHARDS: "6"
          WEB_TEST_SHARD_INDEX: ${{ matrix.shard }}
        run: bun run test:web

  strict-web-leg-e2e:
    if: github.event_name == 'workflow_dispatch' && inputs.strict_verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: e2e-1
            specs: e2e/accessibility e2e/allday
          - leg: e2e-2
            specs: e2e/booking e2e/oauth e2e/auth e2e/billing
          - leg: e2e-3
            specs: e2e/timed
          - leg: e2e-4
            specs: e2e/onboarding e2e/calendars e2e/life e2e/navigation e2e/attendees
          - leg: e2e-5
            specs: e2e/dst e2e/event-form e2e/journey e2e/overlap e2e/parity
    container:
      # Match @playwright/test 1.64.1 in bun.lock (OCI index v1.64.1-noble on MCR).
      image: mcr.microsoft.com/playwright:v1.64.1-noble
      options: --ipc=host
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install Bun
        timeout-minutes: 2
        run: |
          npm install --global --no-audit --no-fund bun@1.3.14
          bun --version

      - name: Cache Bun dependencies
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify Playwright browser install
        timeout-minutes: 3
        run: bunx playwright install chromium

      - name: Run e2e shard
        timeout-minutes: 12
        env:
          TZ: Etc/UTC
          GOOGLE_CLIENT_ID: test-client-id
          API_BASEURL: http://localhost:3000/api
          SPECS: ${{ matrix.specs }}
        run: |
          # shellcheck disable=SC2086
          bunx playwright test $SPECS

      - name: Summarize flaky Playwright tests
        if: always()
        run: bash .github/scripts/playwright-flaky-summary.sh

  strict-web:
    if: github.event_name == 'workflow_dispatch' && inputs.strict_verify
    needs: [strict-web-leg-web, strict-web-leg-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every strict web leg to pass
        env:
          WEB_RESULT: ${{ needs.strict-web-leg-web.result }}
          E2E_RESULT: ${{ needs.strict-web-leg-e2e.result }}
        run: |
          echo "strict-web web shards: ${WEB_RESULT}"
          echo "strict-web e2e shards: ${E2E_RESULT}"
          case "$WEB_RESULT" in success) ;; *) exit 1 ;; esac
          case "$E2E_RESULT" in success) ;; *) exit 1 ;; esac

  # One required context whether or not the build ran, like `unit` over
  # `unit-leg`. `changes` must succeed too: a failed filter skips `build`,
  # and a skipped build alone would read as a pass.
  macos:
    needs: [changes, macos-build, macos-ui-shard, swift-packages, strict, strict-web]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require the macOS build to pass
        env:
          CHANGES: ${{ needs.changes.result }}
          BUILD: ${{ needs.macos-build.result }}
          UI_SHARDS: ${{ needs.macos-ui-shard.result }}
          SWIFT_PACKAGES: ${{ needs.swift-packages.result }}
          STRICT: ${{ needs.strict.result }}
          STRICT_WEB: ${{ needs.strict-web.result }}
          STRICT_REQUESTED: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_verify }}
        run: |
          echo "changes: ${CHANGES}, macos-build: ${BUILD}, ui-shards: ${UI_SHARDS}, swift-packages: ${SWIFT_PACKAGES}"
          [ "$CHANGES" = "success" ] || exit 1
          if [ "$STRICT_REQUESTED" = "true" ]; then
            [ "$STRICT" = "success" ] && [ "$STRICT_WEB" = "success" ] || exit 1
          fi
          for leg in "$BUILD" "$UI_SHARDS" "$SWIFT_PACKAGES" "$STRICT" "$STRICT_WEB"; do
            case "$leg" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
