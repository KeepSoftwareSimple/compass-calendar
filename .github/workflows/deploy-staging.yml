name: Deploy staging

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag being deployed, such as v1.2.3'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag being deployed, such as v1.2.3'
        required: true
        type: string

permissions:
  contents: read

jobs:
  notify-failure:
    name: Notify on failure
    if: failure()
    needs:
      - deploy-cloud
      - health-check-cloud
      - deploy-selfhosted
      - health-check-selfhosted
    uses: ./.github/workflows/_notify-failure.yml
    with:
      tag: ${{ inputs.tag }}
      needs_json: ${{ toJSON(needs) }}
    secrets: inherit

  deploy-cloud:
    name: Deploy to staging-cloud
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      tag: ${{ inputs.tag }}
      environment: staging-cloud
    secrets: inherit

  health-check-cloud:
    name: Health check staging-cloud
    needs: deploy-cloud
    uses: ./.github/workflows/deploy-health-check.yml
    with:
      tag: ${{ inputs.tag }}
      environment: staging-cloud
      profile: cloud
    secrets: inherit

  deploy-selfhosted:
    name: Deploy to staging-selfhosted
    uses: ./.github/workflows/_deploy-environment.yml
    with:
      tag: ${{ inputs.tag }}
      environment: staging-selfhosted
    secrets: inherit

  health-check-selfhosted:
    name: Health check staging-selfhosted
    needs: deploy-selfhosted
    uses: ./.github/workflows/deploy-health-check.yml
    with:
      tag: ${{ inputs.tag }}
      environment: staging-selfhosted
      profile: selfhosted
    secrets: inherit
