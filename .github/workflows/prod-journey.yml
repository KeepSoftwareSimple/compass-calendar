name: Prod journey

# Production synthetic journey. Manual only until test logins and Stripe
# discount secrets are provisioned. Do not enable schedule until Tyler OKs.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prod-journey
  cancel-in-progress: true

jobs:
  journey:
    name: "prod journey (${{ matrix.provider }})"
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        provider: [google, microsoft, apple]
    environment: prod-journey
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run prod journey leg
        env:
          DISCORD_ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL }}
          PROD_JOURNEY_PROVIDER: ${{ matrix.provider }}
          PROD_JOURNEY_GOOGLE_EMAIL: ${{ secrets.PROD_JOURNEY_GOOGLE_EMAIL }}
          PROD_JOURNEY_GOOGLE_PASSWORD: ${{ secrets.PROD_JOURNEY_GOOGLE_PASSWORD }}
          PROD_JOURNEY_MICROSOFT_EMAIL: ${{ secrets.PROD_JOURNEY_MICROSOFT_EMAIL }}
          PROD_JOURNEY_MICROSOFT_PASSWORD: ${{ secrets.PROD_JOURNEY_MICROSOFT_PASSWORD }}
          PROD_JOURNEY_APPLE_EMAIL: ${{ secrets.PROD_JOURNEY_APPLE_EMAIL }}
          PROD_JOURNEY_APPLE_PASSWORD: ${{ secrets.PROD_JOURNEY_APPLE_PASSWORD }}
          STRIPE_SYNTHETIC_JOURNEY_DISCOUNT_ID: ${{ secrets.STRIPE_SYNTHETIC_JOURNEY_DISCOUNT_ID }}
        run: bash .github/scripts/prod-journey.sh

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: prod-journey-${{ matrix.provider }}-${{ github.run_id }}
          path: e2e/test-results/prod-journey/
          retention-days: 7
          if-no-files-found: warn

      - name: Notify Discord on failure
        if: failure()
        env:
          DISCORD_ERRORS_WEBHOOK_URL: ${{ secrets.DISCORD_ERRORS_WEBHOOK_URL }}
        run: |
          bash .github/scripts/discord-notify.sh \
            "prod-journey failed for ${{ matrix.provider }}. ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
