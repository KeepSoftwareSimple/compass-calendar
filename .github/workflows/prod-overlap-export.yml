name: Prod overlap export

# Read-only Tyler overlap repro data from production Sync. Manual only.
on:
  workflow_dispatch:
    inputs:
      principal_id:
        description: Optional 24-char Compass user id (skips Mongo lookup when set)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prod-overlap-export
  cancel-in-progress: true

jobs:
  export:
    name: Export scrubbed Oct 31 overlap slice
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Export scrubbed prod overlap day
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          SYNC_INTERNAL_AUTH_TOKEN: ${{ secrets.SYNC_INTERNAL_AUTH_TOKEN }}
          PROD_OVERLAP_PRINCIPAL_ID: ${{ inputs.principal_id || vars.PROD_OVERLAP_PRINCIPAL_ID }}
        run: bash .github/scripts/prod-overlap-export.sh prod-overlap-export.json

      - name: Upload scrubbed overlap artifact
        uses: actions/upload-artifact@v7
        with:
          name: prod-overlap-export
          path: prod-overlap-export.json
          if-no-files-found: error
