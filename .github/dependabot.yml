# Dependabot PRs target main so the required checks run on them; the
# `dependencies` side branch they used to target had no checks and nobody
# drained it. Weekly, grouped, capped, so the queue is not flooded.
version: 2
updates:
  # Use Bun so dependency PRs update bun.lock alongside package.json.
  # CI intentionally rejects stale lockfiles with --frozen-lockfile.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
