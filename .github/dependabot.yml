# PRs target main and use its required checks. Group only packages that
# should upgrade together. Other updates get individual PRs.
version: 2
updates:
  # Use Bun so dependency PRs update bun.lock alongside package.json.
  # CI intentionally rejects stale lockfiles with --frozen-lockfile.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: "chore(deps)"
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
      tiptap:
        patterns:
          - "@tiptap/*"
      react-query:
        patterns:
          - "@tanstack/react-query"
          - "@tanstack/react-query-devtools"
      tailwind:
        patterns:
          - "tailwindcss"
          - "@tailwindcss/*"
      playwright:
        patterns:
          - "@playwright/test"
          - "playwright"
          - "playwright-core"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
    commit-message:
      prefix: "chore(ci)"
