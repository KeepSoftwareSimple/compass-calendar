# Build-time config for the CI web builds: the performance budget
# (perf-budget.yml) and the required boot-size check (test-unit.yml).
# Only the values baked into the web bundle matter (nodeEnv, apiUrl,
# empty PostHog key so analytics stays out of the measurement); the rest
# exist to satisfy config schema validation and are never used.
# packages/web/build.ts re-execs itself with NODE_ENV set to runtime.nodeEnv
# before bundling. Bun's export conditions are fixed at process start, so a
# production nodeEnv selects production React.
#
# self-host/Dockerfile.web generates the config that actually ships and is
# canonical for the boot-size budget. It differs from this file only in
# google.clientId ("" vs a placeholder), a plain define constant, and both
# measured chunkCount 85 on 2026-09-15. If they ever diverge in a field that
# changes the chunk graph, update this file to match the Dockerfile.
runtime:
  nodeEnv: production
  timezone: Etc/UTC
web:
  url: http://localhost:9161
backend:
  # Nothing listens on 3000 in the perf job; boot-time API calls fail fast,
  # same as the e2e suite's setup.
  apiUrl: http://localhost:3000/api
  compassToken: unused-perf-build
mongo:
  uri: mongodb://localhost:27017/unused
supertokens:
  uri: http://localhost:3567
  key: unused-perf-build
google:
  clientId: unused-perf-build
  clientSecret: unused-perf-build
