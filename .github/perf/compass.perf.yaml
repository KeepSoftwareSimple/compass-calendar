# Build-time config for the Lighthouse performance budget (perf-budget.yml).
# The required boot-size check in test-unit.yml uses compass.boot-size.yaml
# and .github/perf/run-boot-size-check.sh so it matches
# .github/docker/Dockerfile.web for cloud deploy.
# Only the values baked into the web bundle matter (nodeEnv, apiUrl,
# PostHog placeholders sized like production deploy); the rest
# exist to satisfy config schema validation and are never used.
# apps/calendar-web/build.ts re-execs itself with NODE_ENV=production before
# bundling unless runtime.nodeEnv is development. Bun's export conditions are
# fixed at process start.
runtime:
  nodeEnv: production
  timezone: Etc/UTC
web:
  url: http://localhost:9161
backend:
  # Nothing listens on 3000 in the perf job; boot-time API calls fail fast,
  # same as the e2e suite's setup.
  apiUrl: https://api.compasscalendar.com/api
  compassToken: unused-perf-build
mongo:
  uri: mongodb://localhost:27017/unused
supertokens:
  uri: http://localhost:3567
  key: unused-perf-build
google:
  # Length matches production OAuth client IDs baked into deploy images.
  clientId: 000000000000-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa.apps.googleusercontent.com
  clientSecret: unused-perf-build
# Production Docker builds bake PostHog env into the bundle; keep placeholders
# here so CI boot-size matches deploy (perf-budget.yml, test-unit.yml).
posthog:
  key: phc_012345678901234567890123456789012345678901234567890123456789012
  host: https://us.i.posthog.com
