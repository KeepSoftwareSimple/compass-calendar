# Staging-only helper: reproduces the pre-proxy layout (single backend on
# 127.0.0.1:3000) for first-cutover proof. Not used in production deploys.
services:
  backend:
    image: switchbacktech/compass-backend:${COMPASS_VERSION:-latest}
    environment:
      COMPASS_CONFIG_FILE: /app/compass.yaml
      COMPASS_CONFIG_REVISION: ${COMPASS_CONFIG_REVISION:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${COMPASS_CONFIG_FILE:-./compass.yaml}:/app/compass.yaml:ro
      - compass_backend_logs:/app/logs
    restart: unless-stopped
    stop_grace_period: 60s
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  compass_backend_logs:
    external: true
    name: compass_compass_backend_logs
