# Compass Self-Hosting Config
#
# Notes
# - The installer writes ~/compass/compass.yaml with generated secrets.
# - For detailed explanations, see: https://docs.compasscalendar.com/docs/config

runtime:
  version: latest
  nodeEnv: production
  logLevel: info
  timezone: Etc/UTC

web:
  port: 9080
  url: REPLACE_WITH_YOUR_WEB_URL # e.g. https://cal.yourdomain.com

backend:
  port: 3000
  apiUrl: REPLACE_WITH_YOUR_API_URL # e.g. https://cal.yourdomain.com/api
  originsAllowed:
    - REPLACE_WITH_YOUR_WEB_URL # e.g. https://cal.yourdomain.com
  compassToken: REPLACE_WITH_COMPASS_TOKEN # any string will do

mongo:
  username: compass
  password: REPLACE_WITH_MONGO_PASSWORD
  replicaSetKey: REPLACE_WITH_MONGO_REPLICA_SET_KEY
  uri: mongodb://compass:REPLACE_WITH_MONGO_PASSWORD@mongo:27017/prod_calendar?authSource=admin&replicaSet=rs0

supertokens:
  uri: http://supertokens:3567
  key: REPLACE_WITH_SUPERTOKENS_KEY
  postgres:
    user: supertokens
    password: REPLACE_WITH_SUPERTOKENS_POSTGRES_PASSWORD
    database: supertokens

# google:
#   clientId: REPLACE_WITH_GOOGLE_CLIENT_ID # e.g. your-id.apps.googleusercontent.com
#   clientSecret: REPLACE_WITH_GOOGLE_CLIENT_SECRET

# microsoft:
#   clientId: REPLACE_WITH_MICROSOFT_CLIENT_ID
#   clientSecret: REPLACE_WITH_MICROSOFT_CLIENT_SECRET

# apple:
#   signIn:
#     servicesId: REPLACE_WITH_APPLE_SERVICES_ID
#     teamId: REPLACE_WITH_APPLE_TEAM_ID
#     keyId: REPLACE_WITH_APPLE_KEY_ID
#     privateKey: REPLACE_WITH_APPLE_PRIVATE_KEY

# stripe:
#   secretKey: REPLACE_WITH_STRIPE_SECRET_KEY
#   webhookSecret: REPLACE_WITH_STRIPE_WEBHOOK_SECRET
#   priceId: REPLACE_WITH_STRIPE_PRICE_ID
#   publishableKey: REPLACE_WITH_STRIPE_PUBLISHABLE_KEY
# Omit this block on self-host. Compass stays fully writable without Stripe.

# email:
#   provider: log
# Omit the whole block on self-host to keep email off (default).
# scheduleProfile fast is rejected when runtime.nodeEnv is production.

# Compass Sync service — self-host runs the same architecture as Compass
# Cloud: this is required, not optional. It uses the SAME bundled mongo as
# `mongo:` above, isolated to its own `compass_sync` database — no separate
# database user exists on the bundled image, so this reuses the root
# credentials, just against a different database name.
sync:
  port: 3010
  mongoUri: mongodb://compass:REPLACE_WITH_MONGO_PASSWORD@mongo:27017/compass_sync?authSource=admin&replicaSet=rs0
  internalAuthToken: REPLACE_WITH_SYNC_INTERNAL_AUTH_TOKEN # any string; must match the value the API uses
  callbackBaseUrl: REPLACE_WITH_YOUR_WEB_URL # public base URL for provider OAuth/webhook callbacks; needs a real domain for Google to deliver push notifications, localhost works for OAuth only
  # postConnectRedirectUrl not needed here: this topology's callbackBaseUrl IS
  # the web app's own public URL (routed to sync via /sync/*), so the default
  # fallback already lands the browser back on the calendar after connect.
  serviceUrl: http://sync:3010 # base URL the API uses to reach this service
  cloudMutationMode: enabled # enabled (default) | maintenance — maintenance rejects cloud edits / connect with typed MAINTENANCE
  execution: active
  maxConcurrency: 4
  # reservedPullLanes: 1 # of maxConcurrency, how many drains never claim initialImport/repair — keeps pulls from starving behind a wave of long imports. Must stay < maxConcurrency.
  enforceLeastPrivilege: false # true only where a scoped compass_sync database user exists (managed cloud)
  compassApiDatabase: prod_calendar # API database the least-privilege check must be denied access to
  # credentialEncryptionKey: REPLACE_WITH_SYNC_CREDENTIAL_ENCRYPTION_KEY # 32-byte base64; required to enable Apple calendar connect
# Public OAuth/webhook paths (via Caddy → sync): /sync/google, /sync/notifications/google
