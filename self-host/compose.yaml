x-local-bindings:
  web: &web-port "127.0.0.1:${WEB_PORT:-9080}:9080"
  booking-web: &booking-web-port "127.0.0.1:${BOOKING_WEB_PORT:-9081}:9081"
  backend: &backend-port "127.0.0.1:${PORT:-3000}:3000"
  sync: &sync-port "127.0.0.1:${SYNC_PORT:-3010}:3010"

services:
  web:
    image: ${COMPASS_WEB_IMAGE:-switchbacktech/compass-web:${COMPASS_VERSION:-latest}}
    # Uncomment the build block below and run `./compass rebuild` to build the web
    # image from source with your own backend.apiUrl and google.clientId baked in.
    # Requires the full repo to be present alongside this compose.yaml.
    # build:
    #   context: ..
    #   dockerfile: self-host/Dockerfile.web
    #   args:
    #     BASEURL: http://localhost:3000/api
    #     GOOGLE_CLIENT_ID: ""
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - *web-port
    read_only: true
    restart: unless-stopped

  booking-web:
    image: ${COMPASS_BOOKING_WEB_IMAGE:-switchbacktech/compass-booking-web:${COMPASS_VERSION:-latest}}
    # Uncomment the build block below to build booking-web from source beside
    # calendar-web. Requires the full repo alongside this compose.yaml.
    # build:
    #   context: ..
    #   dockerfile: apps/booking-web/Dockerfile
    #   args:
    #     API_BASEURL: http://localhost:3000/api
    profiles: [booking]
    depends_on:
      backend:
        condition: service_healthy
    environment:
      WEB_PORT: "9081"
      WEB_ROOT: /app/build/booking-web
    ports:
      - *booking-web-port
    read_only: true
    restart: unless-stopped

  backend:
    image: switchbacktech/compass-backend:${COMPASS_VERSION:-latest}
    # No depends_on mongo here: mongo is gated behind the `selfhosted` profile,
    # and cloud/Atlas deploys run without a local mongo service. A hard
    # dependency in this base file makes those projects invalid ("depends on
    # undefined service mongo"). `required: false` is not a substitute — Compose
    # treats an unhealthy optional dependency as satisfied and starts backend
    # before mongo is ready. The selfhosted wait lives in
    # compose.selfhosted.yaml and is applied by the compass helper when the
    # selfhosted profile is active.
    environment:
      COMPASS_CONFIG_FILE: /app/compass.yaml
      # Default to info so health-check requests stay out of the tail. Reveal
      # them with `LOG_LEVEL=debug docker compose up -d backend`. A logLevel in
      # compass.yaml takes precedence over this default.
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - *backend-port
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${COMPASS_CONFIG_FILE:-./compass.yaml}:/app/compass.yaml:ro
      - compass_backend_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3000/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  sync:
    image: switchbacktech/compass-sync:${COMPASS_VERSION:-latest}
    # Gated behind the `sync` profile: the deploy enables it only where an
    # isolated sync database is provisioned, so environments without one never
    # start a crash-looping container. Where enabled, Sync stays passive
    # (serves health, does no provider work) until explicitly activated.
    # Bound to loopback only so the host Caddy can reverse-proxy the public
    # `/sync/*` OAuth + webhook paths; not exposed on a public interface.
    # No depends_on mongo: Atlas environments have no mongo container, and the
    # service tolerates a not-yet-ready store while its readiness probe stays
    # unhealthy until storage is available.
    profiles: [sync]
    ports:
      - *sync-port
    environment:
      COMPASS_CONFIG_FILE: /app/compass.yaml
      LOG_LEVEL: ${LOG_LEVEL:-info}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - ${COMPASS_CONFIG_FILE:-./compass.yaml}:/app/compass.yaml:ro
      # The shared logger writes logs/app.log; the root fs is read-only, so
      # give it a writable mount (same as the backend).
      - compass_sync_logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bun -e \"fetch('http://127.0.0.1:3010/health/ready').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  mongo:
    image: switchbacktech/compass-mongo:${COMPASS_VERSION:-latest}
    profiles: [selfhosted]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-compass}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-change-me-mongo-password-32chars}
      MONGO_REPLICA_SET_KEY: ${MONGO_REPLICA_SET_KEY:-${MONGO_INITDB_ROOT_PASSWORD:-change-me-mongo-password-32chars}}
    volumes:
      - compass_mongo_data:/data/db
      - compass_mongo_configdb:/data/configdb
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username \"$$MONGO_INITDB_ROOT_USERNAME\" --password \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'try { const status = rs.status(); if (status.ok === 1 && status.myState === 1) quit(0); } catch (e) { try { rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] }); } catch (initError) { if (!String(initError).includes(\"already initialized\")) throw initError; } } const status = rs.status(); quit(status.ok === 1 && status.myState === 1 ? 0 : 1);'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  supertokens:
    image: supertokens/supertokens-postgresql:11.0.2
    profiles: [selfhosted]
    depends_on:
      supertokens-db:
        condition: service_healthy
    environment:
      API_KEYS: ${SUPERTOKENS_KEY:-change-me-supertokens-key-32chars}
      POSTGRESQL_CONNECTION_URI: postgresql://${SUPERTOKENS_POSTGRES_USER:-supertokens}:${SUPERTOKENS_POSTGRES_PASSWORD:-change-me-supertokens-postgres-pass-32}@supertokens-db:5432/${SUPERTOKENS_POSTGRES_DB:-supertokens}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/localhost/3567 && printf \"GET /hello HTTP/1.1\\r\\nhost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep \"Hello\"'",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  supertokens-db:
    image: postgres:16-alpine
    profiles: [selfhosted]
    environment:
      POSTGRES_USER: ${SUPERTOKENS_POSTGRES_USER:-supertokens}
      POSTGRES_PASSWORD: ${SUPERTOKENS_POSTGRES_PASSWORD:-change-me-supertokens-postgres-pass-32}
      POSTGRES_DB: ${SUPERTOKENS_POSTGRES_DB:-supertokens}
    volumes:
      - compass_supertokens_postgres_data:/var/lib/postgresql/data
    stop_grace_period: 30s
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  compass_backend_logs:
  compass_sync_logs:
  compass_mongo_configdb:
  compass_mongo_data:
  compass_supertokens_postgres_data:
