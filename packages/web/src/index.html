<!doctype html>
<html lang="en" data-theme="light-beach">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f3eee2" />

    <!--
      Apply a stored dark theme before first paint so those visitors don't
      flash the default light palette while the app boots (index.tsx awaits
      IndexedDB first). Runs pre-module, so the key + colors are hard-coded
      here; keep them in sync with settings/theme/theme.constants.ts and
      settings/theme/theme.util.ts. Light is the CSS default, so only dark
      needs touching. An explicit stored choice wins.
    -->
    <script>
      try {
        const stored = localStorage.getItem("compass.theme");
        if (stored === "dark-abyss") {
          document.documentElement.setAttribute("data-theme", "dark-abyss");
          document
            .querySelector('meta[name="theme-color"]')
            .setAttribute("content", "#06090f");
        }
      } catch {}
    </script>

    <title>Compass Calendar</title>
    <meta
      name="description"
      content="Compass is the keyboard calendar: a faster, simpler, open-source calendar for busy professionals who live at their keyboard. No clicks allowed."
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.compasscalendar.com/" />

    <!-- Open Graph (social sharing) -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Compass Calendar" />
    <meta
      property="og:title"
      content="Compass: The Keyboard Calendar"
    />
    <meta
      property="og:description"
      content="Rediscover the joy of shortcuts as you build your perfect schedule. No clicks allowed."
    />
    <meta property="og:url" content="https://www.compasscalendar.com/" />
    <meta
      property="og:image"
      content="https://www.compasscalendar.com/og-image.png"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Compass: The Keyboard Calendar"
    />
    <meta
      name="twitter:description"
      content="Rediscover the joy of shortcuts as you build your perfect schedule. No clicks allowed."
    />
    <meta
      name="twitter:image"
      content="https://www.compasscalendar.com/og-image.png"
    />

    <!-- Structured data for rich search results -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "SoftwareApplication",
        "name": "Compass Calendar",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "url": "https://www.compasscalendar.com/",
        "description": "Compass is a small but mighty calendar for busy minimalists: a simple, keyboard-first way to plan your week around what matters.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>

    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Font CSS must not delay the HTML shell or welcome text. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Rubik:ital,wght@0,300..700;1,300..700&family=VT323&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />

    <!--
      Bun names the src/index.tsx entrypoint's outputs after the entry file
      (/index.js + /index.css), so this file can reference them statically.
      copy-static-assets.ts asserts both exist at build time.

      The built copy of this file additionally gets modulepreload links for
      every boot-critical chunk, appended to head by inject-module-preloads.ts.
    -->
    <link rel="stylesheet" href="/index.css" />
    <!-- Self-contained shell styles need no JavaScript or web fonts. -->
    <style>
      body { margin: 0; }
      #boot-shell {
        box-sizing: border-box;
        min-height: 100vh;
        padding: 2rem;
        background: var(--background, #f3eee2);
        color: var(--text, #403a2f);
        font: 1rem/1.5 system-ui, sans-serif;
      }
      [data-theme="dark-abyss"] #boot-shell {
        background: var(--background, #06090f);
        color: var(--text, #d2d9e1);
      }
      #boot-shell h1 { margin: 0; font-size: 1.5rem; }
      #boot-grid {
        height: 65vh;
        margin-top: 2rem;
        border: 1px solid currentColor;
        border-radius: .5rem;
        opacity: .12;
        background-image:
          linear-gradient(to right, currentColor 1px, transparent 1px),
          linear-gradient(to bottom, currentColor 1px, transparent 1px);
        background-size: calc(100% / 7) 100%, 100% 4rem;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <main id="boot-shell" aria-busy="true" aria-label="Compass Calendar">
        <h1>Compass Calendar</h1>
        <p role="status">Loading your calendar…</p>
        <div id="boot-grid" aria-hidden="true"></div>
        <noscript>Enable JavaScript to use Compass Calendar.</noscript>
      </main>
    </div>
    <script type="module" src="/index.js"></script>
  </body>
</html>
